<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMA Station Tab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-box {
            height: 300px;
            overflow-y: scroll;
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2>💻 CSMA Station Terminal</h2>
    
    <div class="row mt-3">
        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-info text-white">Identity</div>
                <div class="card-body">
                    <input type="text" id="macId" class="form-control mb-2" placeholder="e.g. MAC-0">
                    <button class="btn btn-info w-100" onclick="connect()">Connect to Network</button>
                </div>
            </div>
            
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-warning">Payload Source</div>
                <div class="card-body">
                    <p class="small text-muted">Because this is a global simulation, the backend currently reads from input.txt for all nodes. However, you can see this node's live thought process below when the Admin starts the simulation.</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-dark text-white">Station Internal Logs</div>
                <div class="card-body p-0">
                    <div id="stationLogs" class="log-box"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const logBox = document.getElementById('stationLogs');
    let myMac = "";
    
    function connect() {
        myMac = document.getElementById('macId').value;
        if(!myMac) { alert("Enter a MAC address!"); return; }
        
        const ws = new WebSocket("ws://" + location.host + "/ws-simulation");
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Only show logs meant for THIS station
            if(data.type === 'STATION' && data.id === myMac) {
                const p = document.createElement('p');
                p.className = 'm-0';
                p.innerText = `[${data.id}] ${data.state}: ${data.msg}`;
                
                if(data.state === 'COLLISION' || data.state === 'ABORTING') p.style.color = '#f00';
                if(data.state === 'SUCCESS') p.style.color = '#0f0';
                if(data.state === 'RECEIVED') { p.style.color = '#0ff'; p.style.fontWeight = 'bold'; }
                
                logBox.appendChild(p);
                logBox.scrollTop = logBox.scrollHeight;
            }
        };
        
        alert("Connected as " + myMac + ". Waiting for Admin to start simulation...");
    }
</script>
</body>
</html>
