<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMA Simulation Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-box {
            height: 300px;
            overflow-y: scroll;
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2>📡 CSMA Network Admin Dashboard</h2>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">Live Web Simulation</div>
                <div class="card-body">
                    <form id="simForm">
                        <div class="mb-3">
                            <label>Strategy</label>
                            <select id="strategy" class="form-select">
                                <option value="1-Persistent">1-Persistent</option>
                                <option value="NON">Non-Persistent</option>
                                <option value="P">p-Persistent</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Collision Detection (CSMA/CD)</label>
                            <select id="useCD" class="form-select">
                                <option value="true">Enable (Abort on collision)</option>
                                <option value="false">Disable (Blind transmission)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>p-Value (if p-Persistent)</label>
                            <input type="number" id="pValue" class="form-control" value="0.1" step="0.01">
                        </div>
                        <button type="button" class="btn btn-success w-100" onclick="startLive()">Start Live Simulation</button>
                    </form>
                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">Channel Live Logs</div>
                <div class="card-body p-0">
                    <div id="channelLogs" class="log-box"></div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-danger text-white">Batch Analysis (Python Integration)</div>
                <div class="card-body">
                    <button class="btn btn-danger w-100" onclick="runBatch()">Run Massive Simulator & Generate Plots</button>
                    <div id="plotContainer" class="mt-3 text-center" style="display:none;">
                        <h5>Generated Graphs:</h5>
                        <img src="/api/plot/plot_throughput" class="img-fluid mb-2 border">
                        <img src="/api/plot/plot_delay" class="img-fluid border">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const logBox = document.getElementById('channelLogs');
    const ws = new WebSocket("ws://" + location.host + "/ws-simulation");
    
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if(data.type === 'CHANNEL') {
            const p = document.createElement('p');
            p.className = 'm-0';
            p.innerText = `[CHANNEL] ${data.state}: ${data.msg}`;
            if(data.state === 'COLLISION') p.style.color = '#f00';
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }
    };

    function startLive() {
        fetch('/api/start-live', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                strategy: document.getElementById('strategy').value,
                useCD: document.getElementById('useCD').value === 'true',
                p: document.getElementById('pValue').value,
                numStations: 3 // Default 3 stations for live view
            })
        }).then(res => res.json()).then(data => alert(data.message));
    }
    
    function runBatch() {
        alert("Batch simulation started... Python is generating graphs. This may take 10 seconds.");
        fetch('/api/run-batch', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            // Append timestamp to break cache
            document.querySelectorAll('#plotContainer img').forEach(img => {
                let src = img.src.split('?')[0];
                img.src = src + '?t=' + new Date().getTime();
            });
            document.getElementById('plotContainer').style.display = 'block';
        });
    }
</script>
</body>
</html>
